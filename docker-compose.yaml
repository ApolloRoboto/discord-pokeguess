name: pokeguess
services:

  discord-bot:
    build: ./
    restart: "unless-stopped"
    environment:
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
      - DISCORD_APPLICATION_ID=${DISCORD_APPLICATION_ID}
    volumes:
      - ./pokemons:/app/pokemons
      # - type: volume
      #   source: pokemonData
      #   target: /app/pokemons
    ports:
      - 8000:8000 # Prometheus

